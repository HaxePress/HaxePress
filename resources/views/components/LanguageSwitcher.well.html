<nav :if="languages.multilingual" class="language-switcher" aria-label="{{ t('Language') }}">
  <a
    :for="choice in languages.choices"
    href="{{ choice.href }}"
    hreflang="{{ choice.code }}"
    lang="{{ choice.code }}"
    dir="{{ choice.direction }}"
    :aria-current="choice.current ? 'true'"
    >{{ choice.name }}</a
  >
</nav>
