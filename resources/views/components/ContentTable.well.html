<props items="List<ContentAdminRowView>" compact="Bool = false" />
<div class="table-scroll">
  <table :class="compact ? 'content-table content-table-compact' : 'content-table'">
    <thead>
      <tr>
        <th>{{ t('Content item') }}</th>
        <th>{{ t('Status') }}</th>
        <th>{{ t('Last updated') }}</th>
        <th><span class="sr-only">{{ t('Actions') }}</span></th>
      </tr>
    </thead>
    <tbody>
      <tr :for="item in items">
        <td><ContentTitleCell :item="item" /></td>
        <td><ContentStatus :item="item" /></td>
        <td class="table-date">{{ item.updatedLabel }}</td>
        <td><ContentRowActions :item="item" /></td>
      </tr>
    </tbody>
  </table>
</div>
