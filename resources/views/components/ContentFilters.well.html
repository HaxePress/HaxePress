<props
  collection="PublicCollectionView"
  path="String"
  query="String"
  category="String"
  categories="List<String> = []"
  tag="String = ''"
  fieldFilters="Map<String, String>?"
/>
<form class="cms-content-filters" action="{{ path }}" method="get">
  <div>
    <label for="content-query">{{ t('Search content') }}</label>
    <input
      id="content-query"
      name="q"
      type="search"
      maxlength="120"
      value="{{ query }}"
      placeholder="{{ t('Find content…') }}"
    />
  </div>
  <div :if="'categories' in collection.features">
    <label for="content-category">{{ t('Category') }}</label>
    <input
      id="content-category"
      name="category"
      list="content-category-options"
      value="{{ category }}"
      autocomplete="off"
      maxlength="80"
      placeholder="{{ t('All categories') }}"
    />
    <datalist id="content-category-options">
      <option :for="option in categories" value="{{ option }}"></option>
    </datalist>
  </div>
  <template :for="field in collection.fields"
    ><div :if="field.filterable and field.publicVisible">
      <label for="filter-{{ field.key }}">{{ field.label }}</label>
      <select
        :if="field.kind == 'select' or field.kind == 'boolean'"
        id="filter-{{ field.key }}"
        name="field_{{ field.key }}"
      >
        <option value="">{{ t('Any value') }}</option>
        <template :if="field.kind == 'boolean'"
          ><option value="true" :selected="fieldFilters[field.key] == 'true'">
            {{ t('Yes') }}
          </option>
          <option value="false" :selected="fieldFilters[field.key] == 'false'">
            {{ t('No') }}
          </option></template
        >
        <option
          :else
          :for="option in field.options"
          value="{{ option.value }}"
          :selected="fieldFilters[field.key] == option.value"
        >
          {{ option.label }}
        </option>
      </select>
      <input
        :else
        id="filter-{{ field.key }}"
        name="field_{{ field.key }}"
        :type="field.kind == 'number' ? 'number' : field.kind == 'date' ? 'date' : 'text'"
        :step="field.kind == 'number' ? 'any'"
        maxlength="240"
        :value="fieldFilters[field.key] ?? ''"
      /></div
  ></template>
  <input :if="tag" type="hidden" name="tag" value="{{ tag }}" />
  <input type="hidden" name="type" value="{{ collection.key }}" />
  <button class="button" type="submit">{{ t('Search') }}</button>
</form>
